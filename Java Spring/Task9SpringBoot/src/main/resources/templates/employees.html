<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>List of Employees</h2>
        <!-- زرار الإضافة -->
        <a th:href="@{/employees/new}" class="btn btn-primary">Add Employee</a>
    </div>

    <table class="table table-striped table-hover table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${listEmployees}">
            <td th:text="${employee.id}">1</td>
            <td th:text="${employee.name}">Ahmed Mohamed</td>
            <td th:text="${employee.age}">25</td>
            <td th:text="${employee.salary}">7500.50</td>
            <td>
                <!-- زرار الحذف -->
                <a th:href="@{/employees/delete/{id}(id=${employee.id})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listEmployees)}">
            <td colspan="5" class="text-center">No employees found.</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
