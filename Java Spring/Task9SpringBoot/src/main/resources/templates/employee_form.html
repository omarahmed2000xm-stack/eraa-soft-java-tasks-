<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Add New Employee</h3>
                </div>
                <div class="card-body">
                    <form action="#" th:action="@{/employees/save}" th:object="${employee}" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Enter employee name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" th:field="*{age}" class="form-control" placeholder="Enter age" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Salary</label>
                            <input type="number" step="0.01" th:field="*{salary}" class="form-control" placeholder="Enter salary" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Save Employee</button>
                        <a href="/employees" class="btn btn-secondary w-100 mt-2">Back to List</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
